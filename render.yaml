services:
  - type: web
    name: fintap-bank-intelligence
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintap-postgres
          property: connectionString
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: MAX_UPLOAD_MB
        value: "25"

databases:
  - name: fintap-postgres
    plan: basic-256mb
